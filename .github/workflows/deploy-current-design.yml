name: Deploy current design preview

on:
  push:
    branches:
      - current-design
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-current-design
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload option1 website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Website/download code/pccs-proposal1-main/option1"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
